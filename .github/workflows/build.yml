# The clean-machine test, on every push: a fresh Windows runner, Visual Studio
# and the Windows SDK, nothing installed first. Warnings fail the build so the
# tree stays warning-free.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: docs/API.md matches the headers
        run: python tools/api_md.py --check

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release -- /m /warnaserror

      - name: What came out
        shell: pwsh
        run: |
          $exes = Get-ChildItem build/Release -Filter *.exe
          $dlls = Get-ChildItem build/Release -Filter *.dll
          "$($exes.Count) executables, $($dlls.Count) DLLs"
          $exes.Name

      - name: Upload the executables
        uses: actions/upload-artifact@v7
        with:
          name: ChronoUI-examples-${{ github.sha }}
          path: |
            build/Release/*.exe
            build/Release/*.dll
            build/Release/assets/**
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev libcairo2-dev libpango1.0-dev libstb-dev fonts-noto-core xvfb xauth

      - name: Configure
        run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build (Release)
        run: cmake --build build-linux

      # Every example opens on a virtual X server, writes its own window to a PNG
      # (CHRONOUI_SHOT, the port's shoot.ps1) and quits; an example that cannot
      # start or paint fails the run, and the PNGs are kept as the visual record.
      - name: Run every example
        run: |
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            fail=0
            for exe in build-linux/Release/*; do
              [ -f "$exe" ] && [ -x "$exe" ] || continue
              name=$(basename "$exe")
              CHRONOUI_SHOT="shots/$name.png" timeout 30 "$exe" > "shots/$name.log" 2>&1
              if [ -s "shots/$name.png" ]; then echo "ok    $name"; else echo "FAIL  $name"; cat "shots/$name.log"; fail=1; fi
            done
            exit $fail'

      - name: Upload the executables and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ChronoUI-linux-${{ github.sha }}
          path: |
            build-linux/Release/
            shots/
          retention-days: 14
